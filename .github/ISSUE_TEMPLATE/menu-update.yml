name: 更新菜单
description: 只提交菜单品类变更
title: "[菜单] "
body:
  - type: markdown
    attributes:
      value: |
        编辑下面的当前菜单数据。每个品类用 `---` 分隔；只改菜单，不需要填写公告、日历或营业状态。
  - type: textarea
    id: menu_changes
    attributes:
      label: 菜单内容
      description: |
        保留要继续供应的品类；修改字段即可。要下架时把状态改成“下架”；要删除可把操作改成“删除”。
      value: |
        操作：修改
        原名称：干姜气泡美式
        分类：特饮
        名称：干姜气泡美式
        英文名：GINGER SPARKLING AMERICANO
        价格：26
        描述：干姜的温暖辛香，搭配气泡的清爽活力，夏天醒脑的一杯。
        咖啡豆：肯尼亚 中深烘 SOE
        产地：Kenya
        烘焙：特饮
        风味：干姜 / 气泡 / 清爽
        状态：正在供应
        图片：./assets/coffee-citrus.png
        
