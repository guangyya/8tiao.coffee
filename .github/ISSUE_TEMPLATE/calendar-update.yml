name: 更新上线日历
description: 只提交营业日历变更
title: "[日历] "
body:
  - type: markdown
    attributes:
      value: |
        只更新上线日历。每行一个日期，格式保持为 `YYYY-MM-DD：时间，主理人在店，安排`；店休可以写 `YYYY-MM-DD：店休，设备维护`。
  - type: textarea
    id: calendar
    attributes:
      label: 上线日历
      value: |
        2026-04-30：12:00 - 19:00，主理人在店，埃塞水洗杯测
        2026-05-01：12:00 - 19:00，主理人在店，只做手冲
        2026-05-02：12:00 - 19:00，主理人不在店，冰冲日
        2026-05-03：12:00 - 19:00，主理人在店，主理人吧台
        2026-05-04：12:00 - 19:00，主理人不在店，新豆上架
        2026-05-05：店休，设备维护
        2026-05-06：12:00 - 19:00，主理人在店，黄昏特饮
    validations:
      required: true
